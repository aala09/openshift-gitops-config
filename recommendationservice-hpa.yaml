
apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:

  name: recommendationservice-hpa

  namespace: online-boutique-dev

  labels:

    app: recommendationservice

    component: hpa

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: recommendationservice

  minReplicas: 1

  maxReplicas: 3

  metrics:

  - type: Resource

    resource:

      name: cpu

      target:

        type: Utilization

        averageUtilization: 70

  behavior:

    scaleDown:

      stabilizationWindowSeconds: 240

    scaleUp:

      stabilizationWindowSeconds: 30

