
apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:

  name: checkoutservice-hpa

  namespace: online-boutique-dev

  labels:

    app: checkoutservice

    component: hpa

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: checkoutservice

  minReplicas: 1

  maxReplicas: 3

  metrics:

  - type: Resource

    resource:

      name: cpu

      target:

        type: Utilization

        averageUtilization: 65

  behavior:

    scaleDown:

      stabilizationWindowSeconds: 180

    scaleUp:

      stabilizationWindowSeconds: 30

      policies:

      - type: Percent

        value: 100

        periodSeconds: 30

